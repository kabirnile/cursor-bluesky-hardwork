@'
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prebuild Native Android Project
        run: pnpm exec expo prebuild --platform android --clean
        env:
          EXPO_NO_GIT_STATUS: 1

      - name: Fix AGP 8 SoftwareComponent Crash
        run: |
          find . -name "build.gradle" -type f | while read file; do
            if grep -q -E "com\.android\.library|expo\.modules\.plugin" "$file"; then
              echo "" >> "$file"
              echo "android { publishing { singleVariant('release'); singleVariant('debug') } }" >> "$file"
            fi
          done
          find . -name "build.gradle.kts" -type f | while read file; do
            if grep -q -E "com\.android\.library|expo\.modules\.plugin" "$file"; then
              echo "" >> "$file"
              echo 'android { publishing { singleVariant("release"); singleVariant("debug") } }' >> "$file"
            fi
          done

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: itsmyturn-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
'@ | Out-File -FilePath ".github\workflows\build-apk.yml" -Encoding utf8
